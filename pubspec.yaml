name: printly
description: "Production-grade thermal printer SDK for Flutter. Bluetooth Classic, BLE, Ethernet/WiFi, ESC/POS, Turkish charset, built-in permission management."
version: 0.1.0-dev
homepage: https://github.com/erenkirkil/printly
repository: https://github.com/erenkirkil/printly
issue_tracker: https://github.com/erenkirkil/printly/issues
topics:
  - printer
  - thermal-printer
  - escpos
  - bluetooth
  - turkish

environment:
  sdk: ^3.9.2
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  esc_pos_utils_plus: ^2.0.4
  image: ^4.8.0
  permission_handler: ^12.0.1
  rxdart: ^0.28.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.6.4
  build_runner: ^2.13.1

flutter:
  plugin:
    platforms:
      android:
        package: com.erenkirkil.printly
        pluginClass: PrintlyPlugin
      ios:
        pluginClass: PrintlyPlugin
