name: printly
description: "Thermal printer SDK for Flutter. Bluetooth Classic + BLE, ESC/POS receipts (text, barcode, QR), and Turkish that prints even on printers that ignore code pages."
version: 0.2.0
homepage: https://github.com/erenkirkil/printly
repository: https://github.com/erenkirkil/printly
issue_tracker: https://github.com/erenkirkil/printly/issues
topics:
  - printer
  - thermal-printer
  - escpos
  - bluetooth
  - turkish

environment:
  sdk: ^3.9.2
  # 3.35.3 is the first Flutter that bundles Dart 3.9.2. 3.35.0 through
  # 3.35.2 ship Dart 3.9.0, so claiming them would send anyone on those
  # releases into a resolution error rather than an honest "unsupported".
  flutter: ">=3.35.3"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  esc_pos_utils_plus: ^2.0.4
  permission_handler: ^12.0.1
  rxdart: ^0.28.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.erenkirkil.printly
        pluginClass: PrintlyPlugin
      ios:
        pluginClass: PrintlyPlugin
