name: printly
description: "Thermal printer SDK for Flutter. Bluetooth Classic + BLE + Ethernet/Wi-Fi (TCP 9100), ESC/POS receipts (text, barcode, QR), and Turkish even on printers that ignore code pages."
version: 0.4.0
homepage: https://github.com/erenkirkil/printly
repository: https://github.com/erenkirkil/printly
issue_tracker: https://github.com/erenkirkil/printly/issues
topics:
  - printer
  - thermal-printer
  - escpos
  - bluetooth
  - turkish

environment:
  sdk: ^3.12.0
  # 3.44 is the first Flutter that builds a plugin which leaves Kotlin to
  # AGP 9 (built-in Kotlin) instead of applying the Kotlin Gradle Plugin
  # itself. 3.44.0 bundles Dart 3.12.0, so the two floors name the same
  # release and neither promises an SDK the other cannot resolve.
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  esc_pos_utils_plus: ^2.0.4
  permission_handler: ^12.0.1
  rxdart: ^0.28.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.erenkirkil.printly
        pluginClass: PrintlyPlugin
      ios:
        pluginClass: PrintlyPlugin
