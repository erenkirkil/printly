name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyze & Test (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      # Both ends are worth seeing; a failure at one should not hide the other.
      fail-fast: false
      matrix:
        include:
          # The floor declared in pubspec.yaml. Without this, reaching for an
          # API or syntax that only exists in a newer SDK silently breaks the
          # minimum the package promises — and nothing here would notice.
          - label: floor 3.35.3
            flutter-version: "3.35.3"
          # Whatever stable is today. This is the end that caught
          # `use_null_aware_elements`: a new analyzer lint on code that had
          # been fine for months. Dependencies also resolve fresh here, since
          # a library does not commit its lockfile.
          - label: stable
            flutter-version: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Empty means "latest on the channel".
          flutter-version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Style, not compatibility — and `dart format` output moves between Dart
      # releases, so two SDKs could disagree with no correct way to satisfy
      # both. Checked once, against the version the repo is formatted with.
      - name: Verify formatting
        if: matrix.label == 'stable'
        run: dart format --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Install example dependencies
        run: flutter pub get
        working-directory: example

      - name: Run example tests
        run: flutter test
        working-directory: example

  build-android:
    name: Build Android (compiles plugin Kotlin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build example APK
        run: flutter build apk --debug
        working-directory: example

  build-ios:
    name: Build iOS (compiles plugin Swift)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build example iOS app (no codesign)
        run: flutter build ios --debug --no-codesign
        working-directory: example

  publish-dry-run:
    name: pub publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Dry-run publish
        run: flutter pub publish --dry-run
