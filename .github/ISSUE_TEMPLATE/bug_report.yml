name: Bug report
description: Something behaves differently than documented
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: input
    id: version
    attributes:
      label: printly version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Both
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Flutter version, OS version, phone/POS model
      placeholder: "Flutter 3.35.7 · Android 12 · Samsung A52"
    validations:
      required: true
  - type: input
    id: printer
    attributes:
      label: Printer
      description: Model and transport (Classic / BLE), if the bug involves one
      placeholder: "Cashino PTP-II, BLE"
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal code or exact tap sequence in the example app
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs. actual
      description: Include the PrintlyErrorCode and message if an exception was thrown
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Action log from the example app, adb logcat, or Xcode console
      render: text
